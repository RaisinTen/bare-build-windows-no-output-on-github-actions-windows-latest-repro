name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x64
            bin: hello
          - os: macos-latest
            host: darwin-arm64
            bin: hello
          - os: windows-latest
            host: win32-x64
            bin: hello.exe
          - os: windows-11-arm
            host: win32-arm64
            bin: hello.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build
        shell: bash
        run: |
          npx bare-build \
            --standalone \
            --base . \
            --name hello \
            --description "bare build hello world repro" \
            --host ${{ matrix.host }} \
            --out out \
            hello.js

      - name: Inspect output
        shell: bash
        run: |
          ls -la out

      - name: Run binary on Linux/macOS
        if: ${{ runner.os != 'Windows' }}
        run: |
          echo "=== Running hello ==="
          ./out/${{ matrix.bin }}
          echo "Exit code: $?"

          echo "=== ran.txt file ==="
          cat ran.txt

          echo "=== Done ==="
        shell: bash

      - name: Run binary on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Write-Host "=== Running hello ==="
          .\out\${{ matrix.bin }}
          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host "=== ran.txt file ==="
          Get-Content ran.txt

          Write-Host "=== Capture stdout/stderr ==="
          .\out\${{ matrix.bin }} *> output.txt
          Write-Host "Exit code after capture: $LASTEXITCODE"

          Write-Host "=== Output file ==="
          if (Test-Path output.txt) {
            Get-Content output.txt
          } else {
            Write-Host "output.txt was not created"
          }

          Write-Host "=== Done ==="
        shell: pwsh
