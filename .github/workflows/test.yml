name: bare-build-windows-no-output-on-github-actions-windows-latest-repro

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build
        shell: bash
        run: |
          npx bare-build \
            --standalone \
            --base . \
            --name hello \
            --description "bare build hello world repro" \
            --out out \
            hello.js

      - name: Inspect output
        shell: bash
        run: |
          ls -la out

      - name: Run binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./out/hello.exe
          else
            ./out/hello
          fi
