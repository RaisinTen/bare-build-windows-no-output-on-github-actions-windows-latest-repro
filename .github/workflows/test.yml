name: bare-build-windows-no-output-on-github-actions-windows-latest-repro

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x64
            bin: hello
          - os: macos-latest
            host: darwin-arm64
            bin: hello
          - os: windows-latest
            host: win32-x64
            bin: hello.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build
        shell: bash
        run: |
          npx bare-build \
            --standalone \
            --base . \
            --name hello \
            --description "bare build hello world repro" \
            --host ${{ matrix.host }} \
            --out out \
            hello.js

      - name: Inspect output
        shell: bash
        run: |
          ls -la out

      - name: Run binary
        shell: bash
        run: |
          ./out/${{ matrix.bin }}
